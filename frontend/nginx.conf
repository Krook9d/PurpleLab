server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 50 MB: nginx defaults to blocking anything over 1 MB
    # (client_max_body_size), well before the request even reaches the
    # backend — which already accepts up to 50 MB
    # (malware_service.MAX_UPLOAD_SIZE). Without this, any real malware
    # upload fails with a 413.
    client_max_body_size 50m;

    # Relative redirects: nginx listens on 80 inside the container but is
    # published on another port, absolute redirects would drop it.
    absolute_redirect off;

    # All API routes go through /api/ (prefix stripped before relaying to
    # the backend) — avoids any collision between frontend routes
    # (/sigma, /malware, /custom-payloads...) and backend routers with the
    # same name: without this prefix, a direct navigation/refresh on
    # /sigma or /custom-payloads landed on the backend's JSON response
    # (proxied by mistake) instead of the React SPA (a latent bug
    # discovered in Milestone 5, present since wave 1).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's default (60s) is too short for several real backend
        # operations: MITRE refresh (~15-60s depending on GitHub), VM
        # restore (up to 90s), forensic disk clone (up to 300s on the
        # backend/agent side) — without this timeout, nginx cuts the
        # connection before the backend is done and the browser sees a
        # generic network error, while the operation keeps running
        # server-side.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # Hunting page: OpenSearch Dashboards, rebranded "PurpleLab Hunting".
    # OSD generates links under /hunting (server.basePath) but answers at
    # its root (rewriteBasePath: false), so the prefix is stripped here.
    # Resolved at request time (variable + Docker DNS) so this nginx still
    # starts when the opensearch-dashboards container is down.
    location /hunting/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $osd_upstream http://opensearch-dashboards:5601;
        rewrite ^/hunting/(.*)$ /$1 break;
        proxy_pass $osd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # PurpleLab colors: inject the theme stylesheet into every OSD page
        # (needs an uncompressed upstream response for sub_filter).
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter "</head>" '<link rel="stylesheet" href="/brand/hunting/theme.css"></head>';
    }
    location = /hunting {
        return 301 /hunting/;
    }

    # SPA: every client-side route (/custom-payloads, /sharing, /login...)
    # must fall back to index.html, not an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
