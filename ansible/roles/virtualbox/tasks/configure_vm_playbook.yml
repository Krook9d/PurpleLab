---
# vm_name and vm_ip_result are already available here: this file runs as
# post_tasks of the same play as roles/virtualbox/tasks/main.yml, which
# already defined them (register is play-scoped, not task-scoped).
# Re-computing them here duplicated the same wait loop (up to 300s more)
# with a different budget than main.yml — exactly the kind of variant
# that already caused a deployment bug.

- name: Wait for the VM to be reachable
  wait_for:
    host: "{{ vm_ip_result.stdout }}"
    port: 5985
    timeout: 300
    delay: 10
  when: vm_ip_result.stdout != ""

- name: Configure the firewall rules for WinRM
  win_shell: |
    netsh advfirewall firewall add rule name="WinRM-HTTP" dir=in localport=5985 protocol=TCP action=allow
    netsh advfirewall firewall add rule name="WinRM-HTTPS" dir=in localport=5986 protocol=TCP action=allow
  delegate_to: "{{ vm_ip_result.stdout }}"
  become: no
  vars:
    ansible_user: vagrant
    ansible_password: vagrant
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Disable the password complexity policy
  win_shell: |
    try {
      # Disable the password complexity policy
      secedit /export /cfg C:\secpol.cfg
      (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" | Out-File C:\secpol.cfg
      secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
      Remove-Item -Path C:\secpol.cfg -Force
      Write-Output "Password complexity policy disabled"
    } catch {
      Write-Output "Error while disabling the complexity policy: $_"
      exit 1
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  become: no
  register: disable_policy_result
  vars:
    ansible_user: vagrant
    ansible_password: vagrant
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Show the policy change result
  debug:
    var: disable_policy_result.stdout_lines
  when: disable_policy_result is defined

- name: Create the OEM administrator user via PowerShell
  win_shell: |
    try {
      $password = ConvertTo-SecureString "oem" -AsPlainText -Force
      New-LocalUser -Name "oem" -Password $password -FullName "OEM Admin" -Description "OEM Administrator" -ErrorAction Stop
      Add-LocalGroupMember -Group "Administrators" -Member "oem" -ErrorAction Stop
      Write-Output "User oem created successfully"
    } catch {
      Write-Output "Error while creating the user: $_"
      # Matched on the exception type, not its (localized) message
      if ($_.Exception.GetType().Name -eq "UserExistsException" -or $_.Exception.Message -like "*already exists*") {
        Write-Output "User oem already exists"
        exit 0
      } else {
        exit 1
      }
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  become: no
  register: create_user_result
  vars:
    ansible_user: vagrant
    ansible_password: vagrant
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Show the user creation result
  debug:
    var: create_user_result.stdout_lines
  when: create_user_result is defined

# -------------------------------------
# Software installation
# -------------------------------------

- name: Check whether .NET Framework 4.8 is present
  win_stat:
    path: 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
  register: dotnet48
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Download .NET Framework 4.8 if missing
  win_get_url:
    url: https://go.microsoft.com/fwlink/?linkid=2088631
    dest: C:\Windows\Temp\ndp48-x86-x64-allos-enu.exe
  when: not dotnet48.stat.exists
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Install .NET Framework 4.8
  win_command: C:\Windows\Temp\ndp48-x86-x64-allos-enu.exe /q /norestart
  when: not dotnet48.stat.exists
  register: install_dotnet
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  ignore_errors: yes
  failed_when: install_dotnet.rc != 0 and install_dotnet.rc != 3010

- name: Reboot the VM if .NET Framework was installed
  win_reboot:
  when: install_dotnet is defined and install_dotnet.rc == 3010
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Install Chocolatey
  win_chocolatey:
    name: chocolatey
    state: present
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Install Python with Chocolatey
  win_chocolatey:
    name: python
    state: present
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Check the Python version
  win_command: python --version
  register: python_version
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Show the installed Python version
  debug:
    var: python_version.stdout
  when: python_version is defined

- name: Download Sysmon
  win_get_url:
    url: https://download.sysinternals.com/files/Sysmon.zip
    dest: C:\Windows\Temp\Sysmon.zip
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Extract Sysmon
  win_unzip:
    src: C:\Windows\Temp\Sysmon.zip
    dest: C:\Windows\Temp\Sysmon
    creates: C:\Windows\Temp\Sysmon\Sysmon64.exe
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Download the SwiftOnSecurity Sysmon configuration
  win_get_url:
    url: https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml
    dest: C:\Windows\Temp\Sysmon\sysmonconfig-export.xml
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Install Sysmon with the configuration
  win_command: C:\Windows\Temp\Sysmon\Sysmon64.exe -accepteula -i C:\Windows\Temp\Sysmon\sysmonconfig-export.xml
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: sysmon_install
  ignore_errors: yes

- name: Check the Sysmon installation
  win_command: C:\Windows\Temp\Sysmon\Sysmon64.exe -c
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: sysmon_check
  when: sysmon_install is defined

- name: Show the Sysmon status
  debug:
    var: sysmon_check.stdout_lines
  when: sysmon_check is defined

# -------------------------------------
# Winlogbeat OSS 7.12.1 installation and configuration
# -------------------------------------
# Pinned to 7.12.1, the last Beats release OpenSearch supports. 7.13+
# (OSS builds included) check on connect that the cluster is a genuine,
# Elastic-licensed Elasticsearch by calling GET /_license, which OpenSearch
# rejects ("Invalid index name [_license], must not start with '_'"): the
# output never connects and nothing is ever indexed. 7.17.29 was tried
# (V4 migration) and broke log collection on every fresh install — it had
# only been "validated" on a VM still running the previously installed
# 7.12.1. The "_type" bulk error 7.12.1 used to hit is fixed server-side
# by compatibility.override_main_response_version (docker-compose.yml),
# not by the Beats version. Confirmed live: 7.17.29 -> _license 400,
# 7.12.1 -> connection established and events indexed. See
# winlogbeat_upgrade tag below for applying this to an already-provisioned
# VM without a full VM rebuild.

- name: Get the host server IP address
  shell: hostname -I | awk '{print $1}'
  register: host_ip
  changed_when: false
  delegate_to: 127.0.0.1
  tags: [winlogbeat_config, winlogbeat_upgrade]

# Idempotent re-run entry point: `ansible-playbook ... --tags
# winlogbeat_upgrade` cleanly replaces an already-installed Winlogbeat
# with a different version (stop + uninstall the old service first, since
# install-service-winlogbeat.ps1 doesn't handle "service already exists
# with different binaries" on its own) — safe no-op on a fresh VM where
# the service doesn't exist yet.
- name: Stop and uninstall the previous Winlogbeat OSS service (if present)
  win_shell: |
    if (Get-Service winlogbeat -ErrorAction SilentlyContinue) {
      Stop-Service winlogbeat -Force
      cd "C:\Program Files\Winlogbeat"
      .\uninstall-service-winlogbeat.ps1
    } else {
      Write-Output "no existing service"
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  ignore_errors: true

- name: Empty the Winlogbeat install directory before reinstalling
  win_file:
    path: C:\Program Files\Winlogbeat
    state: absent
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Download Winlogbeat OSS 7.12.1 (last version compatible with OpenSearch)
  win_get_url:
    url: https://artifacts.elastic.co/downloads/beats/winlogbeat/winlogbeat-oss-7.12.1-windows-x86_64.zip
    dest: C:\Windows\Temp\winlogbeat.zip
    force: true
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the Winlogbeat directory
  win_file:
    path: C:\Program Files\Winlogbeat
    state: directory
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Extract Winlogbeat OSS
  win_unzip:
    src: C:\Windows\Temp\winlogbeat.zip
    dest: C:\Windows\Temp\
    creates: C:\Windows\Temp\winlogbeat-7.12.1-windows-x86_64
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: List the temporary directory contents (for debugging)
  win_shell: |
    Get-ChildItem C:\Windows\Temp\*winlogbeat* -Recurse | Select-Object FullName
  register: temp_dir_listing
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Show the temporary directory contents
  debug:
    var: temp_dir_listing.stdout_lines

- name: Copy the Winlogbeat OSS files into the install directory
  win_shell: |
    # Explicit folder (the OSS zip extracts without "-oss" in its name)
    # rather than the first *winlogbeat* folder found: a leftover folder
    # from another version in C:\Windows\Temp would otherwise be picked.
    $source = "C:\Windows\Temp\winlogbeat-7.12.1-windows-x86_64"
    if (Test-Path $source) {
      Copy-Item -Path "$source\*" -Destination "C:\Program Files\Winlogbeat" -Recurse -Force
      Write-Output "Files copied from $source"
    } else {
      Write-Error "No Winlogbeat directory found in C:\Windows\Temp"
      exit 1
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Configure Winlogbeat OSS to ship logs to OpenSearch
  win_template:
    src: "{{ playbook_dir }}/roles/virtualbox/templates/winlogbeat.yml.j2"
    dest: C:\Program Files\Winlogbeat\winlogbeat.yml
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_config, winlogbeat_upgrade]
  vars:
    opensearch_host: "{{ host_ip.stdout }}"
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

# Idempotent re-run entry point: `ansible-playbook ... --tags winlogbeat_config`
# pushes a corrected winlogbeat.yml.j2 (e.g. after moving OpenSearch, see V4
# migration) into an already-provisioned VM and restarts the service to pick
# it up, without re-downloading/reinstalling Winlogbeat. Necessary because
# vmbridge-agent's guestcontrol-based guest exec runs oem under a UAC-filtered
# non-admin token and cannot write to C:\Program Files\... at all (confirmed:
# "Access is denied") — unlike this WinRM path, which does get an elevated
# token for the same account. This restart is also safe to run unconditionally
# as part of a fresh install (right after the service is first started below):
# a few extra seconds, and it removes any assumption that win_service's
# state:started alone is enough to pick up a freshly written config.
- name: Restart Winlogbeat OSS (applies a modified winlogbeat.yml)
  win_service:
    name: winlogbeat
    state: restarted
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_config, winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  ignore_errors: true  # service may not exist yet on a first install/right after the upgrade tag's uninstall step above — the win_service "started" task further down handles that case

- name: Install Winlogbeat OSS as a Windows service
  win_shell: |
    cd "C:\Program Files\Winlogbeat"
    .\install-service-winlogbeat.ps1
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Start the Winlogbeat OSS service
  win_service:
    name: winlogbeat
    state: started
    start_mode: auto
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Check the Winlogbeat OSS service state
  win_service:
    name: winlogbeat
  register: winlogbeat_status
  delegate_to: "{{ vm_ip_result.stdout }}"
  tags: [winlogbeat_upgrade]
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Show the Winlogbeat OSS service state
  debug:
    var: winlogbeat_status
  when: winlogbeat_status is defined

# The opensearch-dashboards-init container (docker-compose.yml) creates the
# winlogbeat-* index pattern long before the VM ships anything. Dashboards
# caches the pattern's field list the first time it's opened: opened
# before any winlogbeat-* index exists, it's saved with 0 fields and never
# refreshed on its own, so Discover crashes on the missing @timestamp
# ("SavedObjectNotFound" from createHistogramConfigs). Once events are
# flowing, refresh that list the same way Dashboards' "Refresh field list"
# button does (fetch _fields_for_wildcard, write it back into the saved
# object). Also a working end-to-end check of log collection: the wait
# fails the play if no event ever reaches OpenSearch.
- name: Wait for the first Winlogbeat events in OpenSearch
  uri:
    url: "http://{{ host_ip.stdout }}:9200/winlogbeat-*/_count"
    return_content: yes
  register: winlogbeat_event_count
  until: winlogbeat_event_count.status == 200 and (winlogbeat_event_count.json.count | int) > 0
  retries: 30
  delay: 10
  delegate_to: 127.0.0.1
  tags: [winlogbeat_config, winlogbeat_upgrade]

- name: Refresh the field list of the winlogbeat-* index pattern (OpenSearch Dashboards)
  shell: |
    set -o pipefail
    curl -sf "http://{{ host_ip.stdout }}:5601/api/index_patterns/_fields_for_wildcard?pattern=winlogbeat-*&meta_fields=_source&meta_fields=_id&meta_fields=_type&meta_fields=_index&meta_fields=_score" \
      | python3 -c 'import json, sys; print(json.dumps({"attributes": {"title": "winlogbeat-*", "timeFieldName": "@timestamp", "fields": json.dumps(json.load(sys.stdin)["fields"])} }))' \
      | curl -sf -X PUT "http://{{ host_ip.stdout }}:5601/api/saved_objects/index-pattern/winlogbeat-*" \
          -H "osd-xsrf: true" -H "Content-Type: application/json" -d @-
  args:
    executable: /bin/bash
  delegate_to: 127.0.0.1
  tags: [winlogbeat_config, winlogbeat_upgrade]

# -------------------------------------
# Windows Defender exclusions and Invoke-AtomicRedTeam installation
# -------------------------------------

- name: Add Windows Defender exclusions for AtomicRedTeam and user folders
  win_shell: |
    try {
      Add-MpPreference -ExclusionPath "C:\AtomicRedTeam" -ErrorAction Stop
      Add-MpPreference -ExclusionPath "C:\Users\oem\Documents" -ErrorAction Stop
      Add-MpPreference -ExclusionPath "C:\Windows\Temp\atomic-red-team-master" -ErrorAction Stop
      Write-Output "Windows Defender exclusions added successfully"
    } catch {
      Write-Output "Error while adding the Windows Defender exclusions: $_"
      exit 1
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: defender_exclusions_result

- name: Show the Windows Defender exclusions result
  debug:
    var: defender_exclusions_result.stdout_lines
  when: defender_exclusions_result is defined

- name: Create the samples folder in Documents
  win_file:
    path: C:\Users\oem\Documents\samples
    state: directory
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the malware_upload folder in Documents
  win_file:
    path: C:\Users\oem\Documents\malware_upload
    state: directory
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the upload folder in Documents
  win_file:
    path: C:\Users\oem\Documents\upload
    state: directory
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the AtomicRedTeam folder
  win_file:
    path: C:\AtomicRedTeam
    state: directory
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the AtomicRedTeam subfolders
  win_file:
    path: "C:\\AtomicRedTeam\\{{ item }}"
    state: directory
  with_items:
    - atomics
    - ExternalPayloads
    - invoke-atomicredteam
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Download the PowerShell-YAML module
  win_get_url:
    url: https://github.com/cloudbase/powershell-yaml/archive/refs/heads/master.zip
    dest: C:\Windows\Temp\powershell-yaml.zip
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Create the PowerShell modules folder
  win_shell: |
    $modulePath = "$HOME\Documents\WindowsPowerShell\Modules"
    if (-not (Test-Path $modulePath)) {
      New-Item -Path $modulePath -ItemType Directory -Force
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Extract and install PowerShell-YAML
  win_shell: |
    Expand-Archive -Path C:\Windows\Temp\powershell-yaml.zip -DestinationPath C:\Windows\Temp\ -Force
    $source = "C:\Windows\Temp\powershell-yaml-master"
    $destination = "$HOME\Documents\WindowsPowerShell\Modules\powershell-yaml"
    
    if (Test-Path $destination) {
      Remove-Item -Path $destination -Recurse -Force
    }
    
    New-Item -Path $destination -ItemType Directory -Force
    Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force
    Write-Output "PowerShell-YAML module installed"
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: yaml_module_result

- name: Show the PowerShell-YAML installation result
  debug:
    var: yaml_module_result.stdout_lines
  when: yaml_module_result is defined

- name: Download Invoke-AtomicRedTeam
  win_get_url:
    url: https://github.com/redcanaryco/invoke-atomicredteam/archive/refs/heads/master.zip
    dest: C:\Windows\Temp\invoke-atomicredteam.zip
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Extract Invoke-AtomicRedTeam
  win_shell: |
    Expand-Archive -Path C:\Windows\Temp\invoke-atomicredteam.zip -DestinationPath C:\Windows\Temp\ -Force
    $source = "C:\Windows\Temp\invoke-atomicredteam-master"
    
    Copy-Item -Path "$source\*" -Destination "C:\AtomicRedTeam\invoke-atomicredteam" -Recurse -Force
    Write-Output "Invoke-AtomicRedTeam extracted and copied"
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: invoke_atomic_extract_result

- name: Download the Atomic tests
  win_get_url:
    url: https://github.com/redcanaryco/atomic-red-team/archive/refs/heads/master.zip
    dest: C:\Windows\Temp\atomic-red-team.zip
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

- name: Temporarily disable Windows Defender
  win_shell: |
    try {
      Set-MpPreference -DisableRealtimeMonitoring $true
      Write-Output "Windows Defender real-time protection temporarily disabled"
    } catch {
      Write-Output "Error while disabling Windows Defender: $_"
      exit 1
    }
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: defender_disable_result

- name: Show the Windows Defender disable result
  debug:
    var: defender_disable_result.stdout_lines
  when: defender_disable_result is defined

- name: Extract and set up the Atomic tests
  win_command: powershell.exe -Command "Expand-Archive -Path C:\Windows\Temp\atomic-red-team.zip -DestinationPath C:\Windows\Temp\ -Force"
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
    ansible_user: oem
    ansible_password: oem
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
  register: atomic_extract_result

- name: Copy the Atomic tests to their final folder
  win_command: powershell.exe -Command "Copy-Item -Path 'C:\Windows\Temp\atomic-red-team-master\atomics' -Destination 'C:\AtomicRedTeam\' -Recurse -Force"
  delegate_to: "{{ vm_ip_result.stdout }}"
  vars:
