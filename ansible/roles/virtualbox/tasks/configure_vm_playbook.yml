  register: import_module_result

- name: Show the module import result
  debug:
    var: import_module_result.stdout_lines
  when: import_module_result is defined

- name: Take a VM snapshot before powering it off
  shell: sudo VBoxManage snapshot "sandbox" take "Snapshot1" --description "snapshot before the mess"
  become: yes
  changed_when: true

- name: Power off the VM cleanly (if it is running)
  shell: |
    VM_STATE=$(sudo VBoxManage showvminfo "sandbox" --machinereadable | grep -i VMState= | cut -d'=' -f2 | tr -d '"')
    if [ "$VM_STATE" = "running" ]; then
      sudo VBoxManage controlvm "sandbox" poweroff
    fi
  changed_when: true
  become: yes

- name: Wait for the .vbox files to settle
  pause:
    seconds: 5

- name: Register the VM if it is not registered yet
  shell: |
    if ! sudo VBoxManage list vms | grep -q '"sandbox"'; then
      sudo VBoxManage registervm "/home/{{ target_user }}/VirtualBox VMs/sandbox/sandbox.vbox"
    fi
  register: vm_register_result
  retries: 3
  delay: 5
  until: vm_register_result.rc == 0
  ignore_errors: yes
  become: yes

- name: Make the shared VirtualBox registry (VBOX_USER_HOME) accessible to vboxusers
  # VBOX_USER_HOME=/var/lib/virtualbox (see main.yml) is shared between
  # root (these Ansible tasks) and purplelab-vm (vmbridge-agent, which
  # drives the VM day to day) — but VirtualBox forces its own registry
  # files (VirtualBox.xml, compreg.dat, ...) to root:root 0600 on every
  # write, whatever the umask. Without this task, vmbridge-agent (running
  # as purplelab-vm, a member of vboxusers but not root) cannot read them
  # and every VBoxManage command times out.
  ansible.builtin.file:
    path: /var/lib/virtualbox
    state: directory
    recurse: yes
    group: vboxusers
    mode: u=rwX,g=rwX,o=
  become: yes
  # "become: yes" alone is not enough: the "ansible_become: no" set on
  # the import in playbook.yml wins over the keyword — only a task-level
  # variable overrides it.
  vars:
    ansible_become: yes

- name: Install acl (setfacl, for the next task)
  ansible.builtin.apt:
    name: acl
    state: present
  become: yes
  vars:
    ansible_become: yes

- name: Let vboxusers traverse the home directory (access to VirtualBox VMs)
  # Ubuntu 22.04 creates home directories as 0750: purplelab-vm
  # (vmbridge-agent) then cannot reach /home/{{ target_user }}/VirtualBox VMs,
  # whatever permissions are set on that folder below — and VBoxManage
  # answers "Could not find a registered machine named 'sandbox'" even
  # though the VM is in the registry. --x ACL only: traverse, without
  # being able to list or read the home (narrower than a chmod o+x,
  # which would open it to every account).
  ansible.builtin.shell: |
    if getfacl -p "/home/{{ target_user }}" | grep -qx 'group:vboxusers:--x'; then
      echo unchanged
    else
      setfacl -m g:vboxusers:--x "/home/{{ target_user }}"
    fi
  register: home_acl_result
  changed_when: "'unchanged' not in home_acl_result.stdout"
  become: yes
  vars:
    ansible_become: yes

- name: Make the VM folder (disks, snapshots) accessible to vboxusers
  # Same problem as above, on a second resource: the folder created by
  # VBoxManage import/startvm/snapshot under
  # /home/{{ target_user }}/VirtualBox VMs/sandbox is left as
  # root:root 0700 (VirtualBox also locks its VM files to the owner
  # only). The shared registry references this folder, but a
  # purplelab-vm process that can read the registry still cannot open
  # the VM's own files without this fix — VBoxSVC then treats the
  # machine as "not found" instead of reporting a permission error,
  # which is misleading when diagnosing.
  ansible.builtin.file:
    path: "/home/{{ target_user }}/VirtualBox VMs"
    state: directory
    recurse: yes
    group: vboxusers
    mode: u=rwX,g=rwX,o=
  become: yes
  # "become: yes" alone is not enough: the "ansible_become: no" set on
  # the import in playbook.yml wins over the keyword — only a task-level
  # variable overrides it.
  vars:
    ansible_become: yes
