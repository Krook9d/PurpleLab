---
# Backend/frontend/DB/OpenSearch: provisioned by docker-compose.yml, no
# longer by Ansible (see README.md — removed in Milestone 6: the
# common/webserver/database/opensearch/opensearch_dashboards roles used
# to provision the old Apache+PHP+native Postgres+native OpenSearch
# stack, entirely replaced now). Only provisioning the Windows sandbox VM
# (out of scope for the V4 migration) remains here.
- name: Provision VirtualBox / Windows sandbox VM
  hosts: all
  become: yes
  roles:
    - { role: virtualbox, tags: ['virtualbox'] }

  post_tasks:
    - name: Configure the Windows VM
      import_tasks: roles/virtualbox/tasks/configure_vm_playbook.yml
      tags:
        - configure_vm
        - vm_config
        - virtualbox
      vars:
        ansible_become: no
